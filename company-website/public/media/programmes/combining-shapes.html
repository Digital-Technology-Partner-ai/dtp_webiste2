<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPEN ME — Disparate signals → one decision</title><style>
:root{color-scheme:dark;--bg:#080b09}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#050705}.hero{position:relative;width:100%;min-height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 54% 72% at 57% 50%,rgba(52,113,61,.14),transparent 72%),linear-gradient(135deg,#0b0e0c,#080b09 64%,#060806)}.art,.convergence-canvas{position:absolute;inset:0;width:100%;height:100%}.convergence-canvas{display:block;pointer-events:none}
</style></head><body><main class="hero"><div class="art" id="art"></div></main><script>
const TAU = Math.PI * 2;
const GOLDEN = Math.PI * (3 - Math.sqrt(5));

const V2_DEFAULTS = Object.freeze({
  seed: 260729,
  loopSeconds: 8,
  maxFps: 30,
  density: 4500,
  mobileDensity: 2200,
  dprCap: 2,
  mobileDprCap: 1.5,
  textSafeFraction: 0.45,
  palette: ['#f2f5ef','#d7ddd7','#c7ffbd','#7cf58d','#93a098','#dfffe0'],
});

const ANCHORS = [
  [-0.32,-0.24],[0,-0.24],[0.32,-0.24],
  [-0.32, 0.24],[0, 0.24],[0.32, 0.24],
];

function hash01(n,seed){
  let x=(n^seed)>>>0;
  x=Math.imul(x^(x>>>16),0x85ebca6b);
  x=Math.imul(x^(x>>>13),0xc2b2ae35);
  return ((x^(x>>>16))>>>0)/4294967295;
}
function clamp01(x){return Math.max(0,Math.min(1,x));}
function smoothstep(a,b,x){const t=clamp01((x-a)/(b-a));return t*t*(3-2*t);}
function mix(a,b,t){return a+(b-a)*t;}

function localFragment(group,j,perGroup,theta,seed,out){
  const q=(j+.5)/perGroup;
  const n1=hash01(j*17+group*991,seed)-.5;
  const n2=hash01(j*29+group*557,seed)-.5;
  const pulse=.018*Math.sin(theta*2+j*.07+group);
  if(group===0){const a=j*GOLDEN;const r=.28*Math.sqrt(q);out.lx=Math.cos(a)*r;out.ly=Math.sin(a)*r+pulse;}
  else if(group===1){out.lx=(q-.5)*.56+n1*.03;out.ly=n2*.12+pulse*.20;}
  else if(group===2){const a=q*TAU;const r=.22+n1*.022;out.lx=Math.cos(a)*r;out.ly=Math.sin(a)*r*.82+pulse;}
  else if(group===3){out.lx=n1*.13;out.ly=(q-.5)*.55+pulse;}
  else if(group===4){const x=(q-.5)*.49;out.lx=x+n1*.03;out.ly=x*.58+n2*.082+pulse;}
  else {const cols=17;const col=j%cols;const row=Math.floor(j/cols)%11;out.lx=(col/(cols-1)-.5)*.40+n1*.015;out.ly=(row/10-.5)*.30+n2*.015+pulse;}
}

/** Six fragments converge, rotate as one form for three seconds, then atomise. */
function sampleConvergence(index,phase01,count,p,out){
  const theta=phase01*TAU;
  const seconds=phase01*p.loopSeconds;
  const groups=ANCHORS.length;
  const group=index%groups;
  const j=Math.floor(index/groups);
  const perGroup=Math.ceil(count/groups);
  const q=(j+.5)/perGroup;
  // Hold the six source forms long enough to read, then assemble, rotate and atomise.
  let gather;
  let rotationProgress=0;
  if(seconds<1.2){
    gather=0;
  }else if(seconds<3.2){
    gather=smoothstep(1.2,3.2,seconds);
  }else if(seconds<5.5){
    gather=1;
    rotationProgress=(seconds-3.2)/2.3;
  }else{
    gather=1-smoothstep(5.5,p.loopSeconds,seconds);
    rotationProgress=1;
  }
  const ease=gather*gather*(3-2*gather);
  localFragment(group,j,perGroup,theta,p.seed,out);
  const [ax,ay]=ANCHORS[group];
  // Keep six distinct source forms inside a padded two-row frame.
  // Only the source geometry is compacted; the unified target remains large.
  const scatteredX=ax+out.lx*.34;
  const scatteredY=ay+out.ly*.34;

  // Every source loses its local topology and enters the same governing geometry:
  // one shared, softly faceted decision lozenge built from an ordered lattice.
  const cols=100;
  const rows=Math.ceil(count/cols);
  const col=index%cols;
  const row=Math.floor(index/cols);
  const nx=col/(cols-1)*2-1;
  const ny=row/(rows-1)*2-1;
  const envelope=1-.30*Math.abs(ny);
  const targetLocalX=nx*.37*envelope;
  const targetLocalY=ny*.28;
  // Give the ordered field a little depth so its 360° turn reads as a solid form.
  const targetLocalZ=(hash01(index*19+3,p.seed)-.5)*.18*(1-.35*Math.min(1,Math.abs(ny)));
  const rotationAngle=rotationProgress*TAU;
  const cosRotation=Math.cos(rotationAngle);
  const sinRotation=Math.sin(rotationAngle);
  const rotatedX=targetLocalX*cosRotation+targetLocalZ*sinRotation;
  const rotatedZ=-targetLocalX*sinRotation+targetLocalZ*cosRotation;
  const depthAmount=Math.sin(Math.PI*rotationProgress);
  const perspective=1/(1+rotatedZ*.75*depthAmount);
  const targetX=rotatedX*perspective;
  const targetY=targetLocalY*perspective;
  const radius=Math.sqrt(nx*nx*.72+ny*ny);

  const bend=Math.sin(Math.PI*ease)*(group<3?-.11:.11)*(1-.35*q);
  const drift=(1-ease)*.018*Math.sin(theta*2+group*1.7+j*.03);
  const x=mix(scatteredX,targetX,ease)+bend;
  const y=mix(scatteredY,targetY,ease)+drift;
  const centre=Math.exp(-Math.pow(radius/.55,2));
  const sourceGreen=(group===2||group===4);
  const sourceColour=sourceGreen?p.palette[2+(group%2)]:p.palette[group%2];
  const unifiedGreen=hash01(index*71+17,p.seed)>.82-centre*.18;
  const unifiedColour=unifiedGreen?p.palette[2+(index%2)]:p.palette[index%2];
  const colour=ease>.72?unifiedColour:sourceColour;
  const sourceBoost=(1-ease)*((group===0||group===3)?.10:0);
  const sourceSizeBoost=(1-ease)*(group===3?.18:(group===0?.10:0));
  out.x=x;out.y=y;out.colour=colour;out.gather=gather;
  // Reuse the same particle record on every iteration to avoid garbage collection.
  out.alpha=.48+.16*ease+.16*centre+hash01(index*5+41,p.seed)*.14+sourceBoost;
  out.size=1.02+.16*ease+.20*centre+hash01(index+97,p.seed)*.38+sourceSizeBoost;
  return out;
}

function createConvergenceArtwork(container,options={}){
  const params={...V2_DEFAULTS,...options};
  const canvas=document.createElement('canvas');
  canvas.className='convergence-canvas';canvas.setAttribute('aria-hidden','true');
  const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});container.append(canvas);
  let width=1,height=1,dpr=1,raf=0,destroyed=false,visible=true,pageVisible=!document.hidden;
  let requestedRunning=true;
  let lastFrame=-Infinity;
  const frameInterval=1000/params.maxFps;
  const point={lx:0,ly:0,x:0,y:0,colour:'',gather:0,alpha:0,size:0};
  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  let reduced=motion.matches;
  const epoch=performance.now();
  const phaseAt=now=>((now-epoch)%(params.loopSeconds*1000))/(params.loopSeconds*1000);

  function render(phase){
    ctx.clearRect(0,0,width,height);
    const mobile=width<760;
    const count=mobile?params.mobileDensity:params.density;
    const artLeft=0;
    const artWidth=width;
    const cx=artLeft+artWidth*.49;
    const cy=height*.5;
    const sx=artWidth*1.05;
    const sy=Math.min(height*.95,artWidth*.90);
    for(let i=0;i<count;i++){
      sampleConvergence(i,phase,count,params,point);
      const x=cx+point.x*sx,y=cy+point.y*sy;
      const ex=Math.max(0,Math.min(1,(1.18-Math.abs(point.x))/.15));
      const ey=Math.max(0,Math.min(1,(.96-Math.abs(point.y))/.13));
      const alpha=Math.min(.94,point.alpha*ex*ey);
      if(alpha<.003)continue;
      ctx.globalAlpha=alpha;ctx.fillStyle=point.colour;
      ctx.fillRect(x,y,point.size,point.size);
    }
    ctx.globalAlpha=1;
  }
  function resize(){if(destroyed)return;const r=container.getBoundingClientRect();width=Math.max(1,r.width);height=Math.max(1,r.height);const cap=width<760?params.mobileDprCap:params.dprCap;dpr=Math.min(devicePixelRatio||1,cap);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const now=performance.now();render(reduced?.5:phaseAt(now));lastFrame=now;}
  function tick(now){raf=0;if(destroyed||reduced||!requestedRunning||!visible||!pageVisible)return;if(now-lastFrame>=frameInterval){render(phaseAt(now));lastFrame=now-((now-lastFrame)%frameInterval);}raf=requestAnimationFrame(tick);}
  function resumeIfAllowed(){if(!destroyed&&!reduced&&requestedRunning&&visible&&pageVisible&&!raf)raf=requestAnimationFrame(tick);}
  function start(){requestedRunning=true;resumeIfAllowed();}
  function pause(){requestedRunning=false;if(raf)cancelAnimationFrame(raf);raf=0;}
  function suspend(){if(raf)cancelAnimationFrame(raf);raf=0;}
  function renderStatic(){requestedRunning=false;suspend();render(.5);}
  function onMotion(e){reduced=e.matches;reduced?renderStatic():resumeIfAllowed();}
  function onVisibility(){pageVisible=!document.hidden;pageVisible?resumeIfAllowed():suspend();}
  const ro=new ResizeObserver(resize);
  const io=new IntersectionObserver(([e])=>{visible=e.isIntersecting;visible?resumeIfAllowed():suspend();},{rootMargin:'80px'});
  ro.observe(container);io.observe(container);motion.addEventListener('change',onMotion);document.addEventListener('visibilitychange',onVisibility);
  resize();reduced?renderStatic():resumeIfAllowed();
  return {start,pause,resize,render,renderStatic,sample:(i,p,c=params.density)=>sampleConvergence(i,p,c,params,{lx:0,ly:0}),snapshot:()=>canvas.toDataURL('image/png'),getState:()=>({width,height,dpr,rafActive:Boolean(raf),requestedRunning,reduced,visible,pageVisible,destroyed}),destroy(){if(destroyed)return;destroyed=true;pause();ro.disconnect();io.disconnect();motion.removeEventListener('change',onMotion);document.removeEventListener('visibilitychange',onVisibility);canvas.remove();}};
}

const art=createConvergenceArtwork(document.querySelector('#art'));window.__CONVERGENCE_ART__=art;
</script></body></html>
