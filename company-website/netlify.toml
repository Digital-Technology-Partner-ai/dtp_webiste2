[build]
  base = "/"
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.12.0"
  NPM_VERSION = "10.9.0"

[[redirects]]
  from = "/phantom-gallery"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/phantom-gallery/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/phantom-gallery/index.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/phantom-gallery/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/news/preview"
  to = "/news"
  status = 302

[[redirects]]
  from = "/news/preview/*"
  to = "/news"
  status = 302

[[redirects]]
  from = "/go/ai-agents"
  to = "/news/2026-06-19-rolling-out-ai-agents-4-ways-to-move-fast-and-furious-but-with-extreme-c/"
  status = 301

[[redirects]]
  from = "/go/ai-agents/"
  to = "/news/2026-06-19-rolling-out-ai-agents-4-ways-to-move-fast-and-furious-but-with-extreme-c/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/home1"
  to = "/"
  status = 301

[[redirects]]
  from = "/news"
  to = "/news/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
